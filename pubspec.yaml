name: sentiment_motivator
description: A sentiment analysis app with AI-powered motivation using Claude API
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Functional Programming
  dartz: ^0.10.1

  # HTTP Client
  dio: ^5.3.2

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Network Connectivity
  connectivity_plus: ^5.0.1

  # Internationalization
  intl: ^0.19.0

  # Animations
  flutter_animate: ^4.3.0

  # PDF & CSV Export
  pdf: ^3.10.7
  printing: ^5.12.0
  csv: ^5.1.1

  # Share Files
  share_plus: ^7.2.2

  # UUID for unique IDs
  uuid: ^4.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.3
  bloc_test: ^9.1.5
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env

